<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>珠子工坊课堂板书</title>
    <style>
      :root {
        --chalk: #f6f1dc;
        --muted: rgba(246, 241, 220, 0.74);
        --coral: #ff9b83;
        --gold: #ffd978;
        --teal: #8dd8cf;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #163a31;
      }

      body {
        font-family: "Hannotate SC", "Kaiti SC", "STKaiti", "KaiTi", cursive;
      }

      .board {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-width: 1120px;
        min-height: 630px;
        background: url("./chalkboard-background.png") center / 100% 100% no-repeat;
        color: var(--chalk);
        text-shadow:
          0 0 1px currentColor,
          0.7px 0.5px 0 rgba(255, 255, 255, 0.15),
          -0.5px 0.8px 0 rgba(255, 255, 255, 0.1);
      }

      .title {
        position: absolute;
        top: 7.2%;
        left: 18%;
        right: 18%;
        margin: 0;
        text-align: center;
        font-size: clamp(32px, 3.15vw, 62px);
        font-weight: 700;
        letter-spacing: 0.12em;
        line-height: 1;
      }

      .title::after {
        content: "";
        display: block;
        width: 62%;
        margin: 1.2vh auto 0;
        border-bottom: 3px solid rgba(246, 241, 220, 0.74);
        border-radius: 50%;
        transform: rotate(-0.25deg);
      }

      .rule {
        position: absolute;
        top: 16.5%;
        left: 50%;
        transform: translateX(-50%) rotate(-0.4deg);
        padding: 0.4vh 1.5vw 0.7vh;
        font-size: clamp(22px, 1.55vw, 31px);
        letter-spacing: 0.16em;
        color: var(--teal);
        border: 2px dashed rgba(141, 216, 207, 0.72);
        border-radius: 44% 51% 46% 55%;
      }

      .divider {
        position: absolute;
        top: 23%;
        bottom: 21%;
        left: 50%;
        width: 0;
        border-left: 3px dashed rgba(246, 241, 220, 0.44);
        transform: rotate(0.35deg);
      }

      .route {
        position: absolute;
        top: 23.5%;
        width: 39%;
        height: 54%;
      }

      .route-left { left: 8.5%; }
      .route-right { right: 8.5%; }

      .route h2 {
        margin: 0 0 2.3vh;
        font-size: clamp(27px, 2vw, 40px);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: 0.06em;
      }

      .route-left h2 { color: var(--coral); transform: rotate(-0.35deg); }
      .route-right h2 { color: var(--gold); transform: rotate(0.25deg); }

      .step {
        display: flex;
        align-items: center;
        min-height: 7.7vh;
        padding-left: 1.4vw;
        border-left: 4px solid rgba(246, 241, 220, 0.38);
        font-size: clamp(25px, 2.1vw, 41px);
        line-height: 1.1;
        letter-spacing: 0.04em;
      }

      .step + .step { margin-top: 1.25vh; }
      .step.red { color: #ffab99; }
      .step.yellow { color: #ffe28f; }

      .formula {
        margin-top: 2.3vh;
        padding: 1.7vh 1.4vw 1.8vh;
        text-align: center;
        font-size: clamp(27px, 2.15vw, 43px);
        line-height: 1;
        letter-spacing: 0.035em;
        border: 3px solid currentColor;
        border-radius: 46% 52% 49% 55%;
      }

      .route-left .formula { color: var(--coral); transform: rotate(0.35deg); }
      .route-right .formula { color: var(--gold); transform: rotate(-0.35deg); }

      .visual-note {
        margin: 2.3vh auto 0;
        width: max-content;
        max-width: 100%;
        font-family: "Hannotate SC", "Kaiti SC", "STKaiti", cursive;
        font-size: clamp(17px, 1.25vw, 25px);
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .bead-row {
        display: inline-flex;
        gap: 0.35vw;
        margin: 0 0.6vw;
        vertical-align: middle;
      }

      .bead-row i {
        display: inline-block;
        width: clamp(9px, 0.75vw, 15px);
        aspect-ratio: 1;
        border: 2px solid currentColor;
        border-radius: 50%;
      }

      .grouping {
        display: flex;
        justify-content: center;
        gap: 1vw;
      }

      .grouping .group {
        padding: 0.35vh 0.55vw 0.6vh;
        border-bottom: 2px solid rgba(246, 241, 220, 0.62);
        color: #ffab99;
      }

      .conclusion {
        position: absolute;
        left: 19%;
        right: 19%;
        bottom: 7.7%;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1.4vw;
      }

      .arrow {
        height: 0;
        border-top: 3px solid rgba(246, 241, 220, 0.66);
        position: relative;
      }

      .arrow.left { transform: rotate(2deg); }
      .arrow.right { transform: rotate(-2deg); }
      .arrow.left::after,
      .arrow.right::before {
        content: "";
        position: absolute;
        top: -8px;
        width: 13px;
        height: 13px;
        border-top: 3px solid rgba(246, 241, 220, 0.66);
        border-right: 3px solid rgba(246, 241, 220, 0.66);
      }
      .arrow.left::after { right: 0; transform: rotate(45deg); }
      .arrow.right::before { left: 0; transform: rotate(-135deg); }

      .answer {
        min-width: 25vw;
        padding: 1.1vh 1.5vw 1.4vh;
        text-align: center;
        border: 3px solid var(--teal);
        border-radius: 49% 43% 51% 46%;
        transform: rotate(-0.25deg);
      }

      .answer span {
        display: block;
        margin-bottom: 0.35vh;
        color: var(--teal);
        font-size: clamp(17px, 1.15vw, 23px);
        letter-spacing: 0.12em;
      }

      .answer strong {
        font-size: clamp(25px, 2.05vw, 41px);
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      @media print {
        @page { size: 16in 9in; margin: 0; }
        body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      }
    </style>
  </head>
  <body>
    <main class="board" aria-label="珠子工坊课堂板书">
      <h1 class="title">珠子工坊　解决问题的两种思路</h1>
      <div class="rule">共同条件　每 8 颗穿 1 条</div>
      <div class="divider" aria-hidden="true"></div>

      <section class="route route-left">
        <h2>① 分别制作，再比较</h2>
        <div class="step red">72÷8＝9（条）</div>
        <div class="step yellow">56÷8＝7（条）</div>
        <div class="step">9－7＝2（条）</div>
        <div class="formula">72÷8－56÷8＝2（条）</div>
        <div class="visual-note">
          9条红手链
          <span class="bead-row" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          比7条黄手链多2条
        </div>
      </section>

      <section class="route route-right">
        <h2>② 先找差额，再分组</h2>
        <div class="step red">72－56＝16（颗）</div>
        <div class="step">16÷8＝2（条）</div>
        <div class="formula">（72－56）÷8＝2（条）</div>
        <div class="visual-note grouping" aria-label="16颗分成两组，每组8颗">
          <span class="group">● ● ● ● ● ● ● ●</span>
          <span class="group">● ● ● ● ● ● ● ●</span>
        </div>
      </section>

      <section class="conclusion">
        <div class="arrow left" aria-hidden="true"></div>
        <div class="answer">
          <span>共同目标</span>
          <strong>红手链比黄手链多 2 条</strong>
        </div>
        <div class="arrow right" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
