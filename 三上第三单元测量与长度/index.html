<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>三上第三单元 · 测量与长度</title>
<style>
:root{--ink:#17394d;--muted:#5a7180;--paper:#f1f6f9;--line:#d9e5ec;--teal:#087f8c;--blue:#3878be;--violet:#7969ac;--gold:#e5aa24;--orange:#d76b3c;--sans:"PingFang SC","Microsoft YaHei",sans-serif;--round:"Yuanti SC","STYuanti",var(--sans)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation;user-select:none}button:focus-visible{outline:4px solid var(--gold);outline-offset:4px}button:disabled{cursor:default;opacity:.35}button:active:not(:disabled){transform:translateY(2px)}
.app{height:100dvh;max-width:2200px;margin:auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:20px 32px 20px;gap:16px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{white-space:nowrap}.brand strong{font-family:var(--round);font-size:clamp(21px,1.65vw,32px);letter-spacing:.03em}.brand small{display:block;font-size:15px;color:var(--muted);margin-top:3px;letter-spacing:.1em}.tabs{display:flex;gap:10px}.tab{background:transparent;border:2px solid transparent;min-height:62px;padding:8px 20px;border-radius:14px;font-size:clamp(20px,1.65vw,30px);font-weight:650;color:var(--muted)}.tab[aria-selected="true"]{border-color:var(--teal);background:#e3f1f3;color:#075e6c}.tab b{margin-right:10px;font-family:"Avenir Next",var(--sans)}
.question{display:flex;align-items:flex-start;gap:22px;min-height:106px;background:#fff;border-radius:18px;padding:20px 26px}.question-number{font-size:clamp(24px,2.2vw,39px);line-height:1.3;color:var(--teal);font-weight:750;padding-right:22px;border-right:2px solid var(--line);white-space:nowrap}.question p{margin:0;font-family:var(--round);font-size:clamp(23px,2.1vw,38px);font-weight:550;line-height:1.5}.question em{font-style:normal;color:#086b7d;font-weight:750;white-space:nowrap}
.board{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden;border-radius:22px;background:#fff;min-height:0;border:1px solid var(--line)}.board svg{display:block;width:100%;height:100%;min-height:0;font-family:var(--sans);font-size:30px;fill:var(--ink)}.board text{font-weight:600}.board .soft{fill:var(--muted);font-weight:500}.board .large{font-size:40px;font-weight:750}.board .small{font-size:25px}.board .unit{font-size:31px}.board .answer{fill:#075e6c;font-size:39px;font-weight:750}.board .guide{stroke:#8ba7b8;stroke-width:2;stroke-dasharray:7 6;fill:none}.board .dim{stroke:var(--ink);stroke-width:2;fill:none}.board .fade-in{animation:appear .45s ease both}.board .slide-in{animation:place .55s ease both}.board .clip-move{animation:align .9s ease both}.board .car-move{animation:drive .95s ease both}.board .rope-grow{animation:rope .65s ease both;transform-origin:left center}.board .knotted{fill:none;stroke:var(--orange);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.board .round-line{stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}.equation-panel{border-top:1px solid var(--line);background:#f1f8f9;padding:13px 26px;display:grid;gap:9px}.equation-row{display:grid;grid-template-columns:106px minmax(0,1fr);gap:20px;align-items:center}.equation-label{font-size:21px;font-weight:650;color:var(--muted);white-space:nowrap}.equation-values{display:flex;align-items:center;flex-wrap:wrap;gap:8px 36px}.equation-value{font-family:"Avenir Next",var(--sans);font-size:clamp(23px,1.85vw,34px);font-weight:700;line-height:1.35;white-space:nowrap}.equation-row.final{border-top:1px solid #cbdfe4;padding-top:9px;color:#075e6c}.equation-row.final .equation-label{color:#075e6c}
@keyframes appear{from{opacity:0}to{opacity:1}}@keyframes place{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes align{from{transform:translateX(60px)}to{transform:translateX(0)}}@keyframes drive{from{transform:translateX(var(--car-from))}to{transform:translateX(0)}}@keyframes rope{from{opacity:.35;transform:scaleX(.88)}to{opacity:1;transform:scaleX(1)}}
.toolbar{display:flex;align-items:center;gap:14px;min-height:72px}.control{display:flex;align-items:center;justify-content:center;min-height:66px;border-radius:14px;padding:12px 25px;font-size:clamp(21px,1.7vw,31px);font-weight:650;background:#e1eaf0;color:var(--ink);white-space:nowrap}.control.prev{min-width:150px}.control.next{background:var(--teal);color:#fff;min-width:310px}.control.reset{background:#fff;border:2px solid var(--line)}.control.fullscreen{margin-left:auto;background:#fff;border:2px solid var(--line);min-width:130px}.control-hint{color:var(--muted);font-size:17px;margin-left:9px;line-height:1.5;white-space:nowrap}.control svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;margin-right:12px}.fullscreen-note{position:absolute;inset:auto 20px 16px auto;max-width:80%;font-size:20px;padding:10px 15px;background:#f1f6f9;border:1px solid var(--line);border-radius:10px;display:none}.fullscreen-note.show{display:block}
@media(min-width:1600px){.app{padding:28px 42px;gap:20px}.question{padding:24px 32px;min-height:126px}.tab{min-height:74px;padding:10px 28px}.control{min-height:78px}.control.next{min-width:390px}.control-hint{font-size:20px}}
@media(max-width:1150px){.app{padding:14px 18px;gap:12px}.brand small{display:none}.tab{padding:7px 12px;min-height:54px}.tabs{gap:5px}.question{padding:16px 20px;min-height:100px;gap:16px}.question-number{padding-right:16px}.control{padding:10px 18px;min-height:58px}.control.next{min-width:260px}.control.prev{min-width:120px}.control-hint{display:none}.toolbar{gap:10px;min-height:58px}}
@media(max-height:690px) and (min-width:850px){.app{padding-top:10px;padding-bottom:10px;gap:10px}.question{min-height:82px;padding:12px 20px}.question p{font-size:24px}.tab{min-height:50px}.brand small{display:none}.toolbar{min-height:56px}.control{min-height:56px}}
@media(max-width:850px){html,body{overflow:auto}.app{min-height:100dvh;height:auto;grid-template-rows:auto auto minmax(320px,1fr) auto}.masthead{align-items:flex-start;flex-direction:column;gap:10px}.tabs{width:100%;justify-content:space-between;gap:4px}.tab{font-size:17px;padding:6px 8px;min-height:48px}.tab b{margin-right:5px}.question{gap:12px;min-height:100px;padding:14px}.question-number{font-size:22px;padding-right:12px}.question p{font-size:21px}.board{height:clamp(310px,50vw,470px)}.toolbar{flex-wrap:wrap;gap:8px}.control{font-size:18px;padding:10px 15px;min-height:52px}.control.next{min-width:220px;flex:1}.control.prev{min-width:100px}.control.fullscreen{min-width:100px;margin-left:0}.control-hint{display:none}.control svg{margin-right:6px;width:20px;height:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:1150px){.equation-panel{padding:10px 18px;gap:7px}.equation-row{grid-template-columns:88px minmax(0,1fr);gap:14px}.equation-label{font-size:18px}.equation-values{gap:5px 24px}}
@media(max-height:690px) and (min-width:850px){.equation-panel{padding:8px 18px;gap:6px}.equation-value{font-size:22px}.equation-row.final{padding-top:6px}}
@media(max-width:850px){.board.has-equations{height:540px}.equation-row{grid-template-columns:1fr;gap:4px}.equation-label{font-size:17px}.equation-value{font-size:20px;white-space:normal}.equation-panel{padding:10px 14px}.equation-values{gap:4px 16px}}
</style>
</head>
<body>
<main class="app">
  <header class="masthead">
    <div class="brand"><strong>测量与长度</strong><small>三年级上册 · 第三单元试卷讲评</small></div>
    <nav class="tabs" role="tablist" aria-label="选择题目">
      <button class="tab" id="tab-3" role="tab" aria-selected="true" aria-controls="lesson" data-q="3"><b>3</b>测铅笔</button>
      <button class="tab" id="tab-5" role="tab" aria-selected="false" aria-controls="lesson" data-q="5" tabindex="-1"><b>5</b>去A市</button>
      <button class="tab" id="tab-6" role="tab" aria-selected="false" aria-controls="lesson" data-q="6" tabindex="-1"><b>6</b>摆椅子</button>
      <button class="tab" id="tab-7" role="tab" aria-selected="false" aria-controls="lesson" data-q="7" tabindex="-1"><b>7</b>绳子打结</button>
    </nav>
  </header>
  <section class="question" aria-label="题干"><div class="question-number" id="question-number">第3题</div><p id="question-text"></p></section>
  <section class="board" id="lesson" role="tabpanel" aria-labelledby="tab-3">
    <svg id="diagram" viewBox="0 0 1440 520" role="img" aria-label="测量铅笔图示"></svg>
    <section class="equation-panel" id="equations" aria-label="算式" aria-live="polite" hidden>
      <div class="equation-row"><span class="equation-label">本步算式</span><div class="equation-values" id="step-equations"></div></div>
      <div class="equation-row final" id="final-equation-row" hidden><span class="equation-label">最终算式</span><div class="equation-values" id="final-equation"></div></div>
    </section>
    <div class="fullscreen-note" id="fullscreen-note" role="status"></div>
  </section>
  <footer class="toolbar" aria-label="教师操作">
    <button class="control prev" id="previous" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>上一步</button>
    <button class="control next" id="next">看清起止刻度<svg viewBox="0 0 24 24" aria-hidden="true" style="margin:0 0 0 14px"><path d="m9 5 7 7-7 7"/></svg></button>
    <button class="control reset" id="reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 0 5M4 3v7h7"/></svg>重来</button>
    <span class="control-hint">← → 切换画面<br>R 重来 · F 全屏</span>
    <button class="control fullscreen" id="fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg><span>全屏</span></button>
  </footer>
</main>
<script>
'use strict';
// 单位基准：测量用毫米；行程用千米；椅子与绳子用厘米。
// 绳子每个结消耗15厘米是两根绳子在该连接处的合计消耗。
const model=Object.freeze({clipStartMM:5,clipEndMM:30,clipCount:3,distanceKM:220,speedKMH:80,startHour:8,endHour:11,wallCM:360,chairCM:40,ropeCount:3,knotCount:2,joinedCM:180,knotLossCM:15});
const derived=Object.freeze({clipMM:model.clipEndMM-model.clipStartMM,pencilMM:(model.clipEndMM-model.clipStartMM)*model.clipCount,travelKM:model.speedKMH*(model.endHour-model.startHour),chairs:model.wallCM/model.chairCM,originalTotalCM:model.joinedCM+model.knotCount*model.knotLossCM,originalRopeCM:(model.joinedCM+model.knotCount*model.knotLossCM)/model.ropeCount});
const lessons={
  3:{text:'下面这支铅笔有多长？',alt:'一枚回形针放在直尺上，左端在5毫米，右端在3厘米；铅笔和三枚首尾相接的回形针一样长。',actions:['看清起止刻度','对齐0刻度','铺开三段长度','显示最终算式']},
  5:{text:'小林一家驾车去相距<em>220千米</em>的A市。<br>汽车每小时行驶<em>80千米</em>，上午<em>8时</em>出发，<em>11时</em>能到达吗？',alt:'家与A市相距220千米，下面是从8时到11时的时间线。',actions:['行驶1小时','再行驶1小时','看看11时能否到达']},
  6:{text:'会议室这面墙长<em>3米6分米</em>，每把椅子宽<em>40厘米</em>。像图中这样紧挨着摆放，可以放多少把？',alt:'墙边紧挨着摆放椅子，墙长3米6分米，每把椅子宽40厘米。',actions:['把墙长换成厘米','再摆一把','再摆一把','再摆一把','再摆一把','再摆一把','再摆一把','显示最终算式']},
  7:{text:'把<em>3根一样长</em>的绳子接成一条长<em>1米8分米</em>的绳子，每个打结处用了<em>15厘米</em>。<br>原来每根绳子长多少分米？',alt:'三根一样长的绳子接为一条，只有两个打结处；每处合计用去15厘米。',actions:['接成一条绳','看看两个打结处','松开绳结，放回用去的长度','对齐三根绳子','显示最终算式']}
};
let question=3,stage=0,animate=true;
const svg=document.getElementById('diagram'),prev=document.getElementById('previous'),next=document.getElementById('next');
const c={ink:'#17394d',muted:'#5a7180',teal:'#087f8c',blue:'#3878be',violet:'#7969ac',gold:'#e5aa24',orange:'#d76b3c',line:'#d9e5ec'};
function text(x,y,value,cls='',anchor='middle',fill=''){return `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}"${fill?` fill="${fill}"`:''}>${value}</text>`}
function line(x1,y1,x2,y2,color=c.ink,width=2,extra=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`}
function dim(x1,x2,y,label,color=c.ink,cls='unit'){return `<g>${line(x1,y,x2,y,color)}${line(x1,y-8,x1,y+8,color)}${line(x2,y-8,x2,y+8,color)}${text((x1+x2)/2,y-17,label,cls,'middle',color)}</g>`}
function pill(x,y,w,label,color=c.teal){return `<g><rect x="${x-w/2}" y="${y-34}" width="${w}" height="56" rx="12" fill="${color}" fill-opacity=".09"/>${text(x,y+5,label,'','middle',color)}</g>`}
function clip(x,y,w,color=c.teal,extra=''){return `<g transform="translate(${x} ${y})"><g ${extra}><path d="M64 7H${w-32}A29 29 0 0 1 ${w-32} 65H32A29 29 0 0 1 32 7H${w-46}A19 19 0 0 1 ${w-46} 45H42A9 9 0 0 1 42 27H${w-61}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>`}
function ruler(x,y,scale=12){let s=`<rect x="${x-16}" y="${y}" width="${50*scale+40}" height="88" rx="7" fill="#fff4d7" stroke="#c6a54f" stroke-width="2"/>`;for(let i=0;i<=50;i++){const tall=i%10===0?31:i%5===0?23:14;s+=line(x+i*scale,y,x+i*scale,y+tall,c.ink,i%10===0?2.3:1.4);if(i%10===0)s+=text(x+i*scale,y+65,i/10,'');}return s+text(x+50*scale+23,y+65,'cm','small','start');}
function pencil(x,y,w){return `<g transform="translate(${x} ${y})"><rect x="0" y="0" width="${w-52}" height="36" rx="2" fill="#e5aa24"/><rect x="0" y="12" width="${w-52}" height="10" fill="#f9d36f"/><path d="M${w-52} 0 ${w} 18 ${w-52} 36Z" fill="#e6c39b"/><path d="M${w-14} 13 ${w} 18 ${w-14} 23Z" fill="${c.ink}"/><rect x="0" width="25" height="36" rx="5" fill="#e9898f"/><rect x="25" width="16" height="36" fill="#b6c8d1"/></g>`}
function q3(){const X=180,S=12,clipW=derived.clipMM*S,clipX=X+(stage<=1?model.clipStartMM*S:0);let s=(stage<2?text(1070,76,'一枚回形针','soft'):'')+ruler(X,167,S);
  if(stage<=1){s+=line(clipX,94,clipX,167,c.teal,2,'stroke-dasharray="6 5"')+line(clipX+clipW,94,clipX+clipW,167,c.teal,2,'stroke-dasharray="6 5"');}
  if(stage===1)s+=text(clipX,79,'起点5毫米','small','middle',c.teal)+text(clipX+clipW,79,'终点30毫米','small','middle',c.teal);
  s+=clip(clipX,91,clipW,c.teal,stage===2&&animate?'class="clip-move"':'');
  if(stage>=2)s+=line(X,90,X,167,c.teal,2,'stroke-dasharray="6 5"')+line(X+clipW,90,X+clipW,167,c.teal,2,'stroke-dasharray="6 5"');
  if(stage>=2)s+=dim(X,X+clipW,80,'25毫米',c.teal)+pill(1070,174,274,'一枚回形针',c.teal)+text(1070,228,'25毫米','large','middle',c.teal);
  const Y=324,colors=[c.teal,c.blue,c.violet];
  for(let i=0;i<model.clipCount;i++){s+=clip(X+i*clipW,Y,clipW,stage>=3?colors[i]:c.teal);if(stage>=3)s+=dim(X+i*clipW,X+(i+1)*clipW,Y-20,'25毫米',colors[i]);}
  s+=pencil(X,403,derived.pencilMM*S)+line(X,385,X,448,c.muted,2,'stroke-dasharray="6 5"')+line(X+derived.pencilMM*S,385,X+derived.pencilMM*S,448,c.muted,2,'stroke-dasharray="6 5"');
  if(stage===4)s+=dim(X,X+derived.pencilMM*S,502,'75毫米（7厘米5毫米）',c.teal,'answer');
  return s;
}
function car(x,y,from=0){return `<g transform="translate(${x} ${y})"><g ${animate&&from?`class="car-move" style="--car-from:${from}px"`:''}><path d="M-48-14-29-44H18L43-14H54Q65-14 65-2V22H-65V-1Q-65-14-48-14Z" fill="${c.teal}"/><path d="M-24-36H-3V-16H-36ZM6-36H14L32-16H6Z" fill="#d9f0f3"/><rect x="49" y="-3" width="12" height="8" rx="3" fill="#ffde77"/><circle cx="-39" cy="23" r="15" fill="${c.ink}"/><circle cx="39" cy="23" r="15" fill="${c.ink}"/><circle cx="-39" cy="23" r="6" fill="#fff"/><circle cx="39" cy="23" r="6" fill="#fff"/></g></g>`}
function town(x,y){return `<g transform="translate(${x} ${y})"><path d="M-54 0V-70H-18V-99H32V-48H60V0Z" fill="#dce8ef" stroke="${c.ink}" stroke-width="2"/>${[-39,-3,18].map(a=>[-24,-44].map(b=>`<rect x="${a}" y="${b}" width="9" height="10" fill="#fff"/>`).join('')).join('')}<path d="M-5 0V-24H12V0" fill="${c.teal}"/></g>`}
function q5(){const X=180,W=1080,scale=W/derived.travelKM,dest=X+model.distanceKM*scale,km=Math.min(stage*model.speedKMH,model.distanceKM),carX=X+km*scale;let s=dim(X,dest,82,'相距220千米')+pill(720,147,300,'每小时80千米');
  s+=line(X,266,dest,266,'#e4edf2',34,'stroke-linecap="round"')+line(X,266,dest,266,'#9ab1bf',2,'stroke-dasharray="14 12"');
  s+=town(dest,245)+text(X,319,'家','','middle')+text(dest,319,'A市','','middle');
  if(stage>0){let before=(stage-1)*model.speedKMH;let from=-((km-before)*scale);s+=car(carX,230,from);}else{s+=car(carX,230);}
  if(stage===1||stage===2)s+=pill(carX,322,160,`${km}千米`);
  if(stage===3){s+=pill(dest-190,192,184,'已到A市')+text(720,359,'11时前能到达','answer');}
  const ty=443,section=W/3;s+=line(X,ty,X+W,ty,'#dce7ee',13,'stroke-linecap="round"');
  for(let i=0;i<3;i++){if(i<stage)s+=line(X+i*section,ty,X+(i+1)*section,ty,c.teal,13,'stroke-linecap="round"');s+=text(X+(i+.5)*section,ty-29,'1小时','small','middle',i<stage?c.teal:c.muted);}
  for(let i=0;i<=3;i++){s+=`<circle cx="${X+i*section}" cy="${ty}" r="9" fill="${i<=stage?c.teal:'#9ab1bf'}"/>`+text(X+i*section,ty+48,`${8+i}时`,'','middle',i===stage?c.teal:c.ink);}
  if(stage===3){s+=`<g class="fade-in">${line(X,390,X+W,390,c.blue,6)}${line(dest,378,dest,402,c.orange,4)}${text(X+W+14,374,'240千米','small','start',c.blue)}${text(dest-14,374,'220千米','small','end',c.orange)}${text(X+14,376,'3小时可行驶','small','start',c.blue)}</g>`;}
  return s;
}
function chair(x,y,w,extra=''){return `<g transform="translate(${x} ${y})"><g ${extra}><rect x="8" y="0" width="${w-16}" height="92" rx="7" fill="#e3f1f3" stroke="${c.teal}" stroke-width="3"/><path d="M${w*.32} 10V80M${w*.68} 10V80" fill="none" stroke="${c.teal}" stroke-width="3"/><rect x="0" y="84" width="${w}" height="24" rx="5" fill="${c.teal}"/><path d="M10 108V163M${w-10} 108V163" fill="none" stroke="${c.ink}" stroke-width="7" stroke-linecap="round"/></g></g>`}
function q6(){const X=180,S=3,W=model.wallCM*S,chairW=model.chairCM*S,count=stage<=1?3:Math.min(stage+2,derived.chairs);let s=dim(X,X+W,82,stage===0?'3米6分米':'360厘米',c.ink,'large');
  s+=`<rect x="${X}" y="118" width="${W}" height="54" rx="6" fill="#e5edf2"/>`+line(X,172,X+W,172,c.ink,3)+line(X,174,X,411,'#8ba7b8',2,'stroke-dasharray="6 6"')+line(X+W,174,X+W,411,'#8ba7b8',2,'stroke-dasharray="6 6"');
  for(let i=0;i<count;i++){s+=chair(X+i*chairW,205,chairW,i===count-1&&stage>=2&&stage<8&&animate?'class="slide-in"':'');if(stage===8)s+=text(X+(i+.5)*chairW,405,i+1,'large','middle',c.teal);}
  if(stage<8)s+=dim(X,X+chairW,426,'40厘米',c.teal);
  if(stage===8){s+=pill(720,474,264,'可以放9把',c.teal);}else{s+=text(1110,475,'紧挨着，不留空隙','soft small');}
  return s;
}
function ropeLine(x1,x2,y,color,width=17){return line(x1,y,x2,y,color,width,'stroke-linecap="butt"');}
function knot(x,y,extra=''){return `<g transform="translate(${x} ${y})"><g ${extra}><path d="M-23-2C-12-25 14-22 20-6C26 11 5 23-8 12C-29-7-13-25 4-16C28-3 17 25 1 18C-16 11-24-13-8-17C6-19 26 12 18 19M-27 8 25-10" class="knotted"/></g></g>`}
function joinedRope(y,labels){const X=216,S=4.8,outer=(derived.originalRopeCM-model.knotLossCM/2)*S,middle=(derived.originalRopeCM-model.knotLossCM)*S,j1=X+outer,j2=j1+middle,end=X+model.joinedCM*S;let s=ropeLine(X,j1,y,c.teal)+ropeLine(j1,j2,y,c.blue)+ropeLine(j2,end,y,c.violet)+knot(j1,y)+knot(j2,y);if(labels){s+=line(j1,y-25,j1,y-65,c.orange,2)+line(j2,y-25,j2,y-65,c.orange,2)+pill(j1,y-87,206,'此处共15厘米',c.orange)+pill(j2,y-87,206,'此处共15厘米',c.orange);}return s;}
function restoredRope(y,fullColor=false){const X=216,S=4.8,outer=(derived.originalRopeCM-model.knotLossCM/2)*S,middle=(derived.originalRopeCM-model.knotLossCM)*S,loss=model.knotLossCM*S;const a=X+outer,b=a+loss,d=b+middle,e=d+loss,end=X+derived.originalTotalCM*S;let s='';if(fullColor){for(let i=0;i<3;i++)s+=ropeLine(X+i*derived.originalRopeCM*S,X+(i+1)*derived.originalRopeCM*S,y,[c.teal,c.blue,c.violet][i],21);}else{s+=ropeLine(X,a,y,c.teal,21)+ropeLine(b,d,y,c.blue,21)+ropeLine(e,end,y,c.violet,21);}
  s+=`<g data-knot-loss-cm="15">${ropeLine(a,b,y,c.orange,21)}${line(a,y-17,a,y+17,c.orange,2)}${line(b,y-17,b,y+17,c.orange,2)}${text((a+b)/2,y-43,'15厘米','small','middle',c.orange)}</g><g data-knot-loss-cm="15">${ropeLine(d,e,y,c.orange,21)}${line(d,y-17,d,y+17,c.orange,2)}${line(e,y-17,e,y+17,c.orange,2)}${text((d+e)/2,y-43,'15厘米','small','middle',c.orange)}</g>`;
  return s;
}
function q7(){const X=216,S=4.8,L=derived.originalRopeCM*S,colors=[c.teal,c.blue,c.violet];let s='';
  if(stage===0){s+=text(720,115,'3根绳子，一样长','large');for(let i=0;i<3;i++){const x=162+i*(L+54);s+=ropeLine(x,x+L,270,colors[i],20)+line(x,251,x,289,colors[i],3)+line(x+L,251,x+L,289,colors[i],3)+text(x+L/2,340,`第${i+1}根`,'');}s+=text(720,435,'接起来以后，长1米8分米','soft');}
  if(stage===1||stage===2){s+=dim(X,X+model.joinedCM*S,stage===1?168:113,'接好后1米8分米',c.ink,'large')+joinedRope(300,stage===2);for(let i=0;i<3;i++){const centers=[366,648,930];s+=text(centers[i],370,`第${i+1}根`,'','middle',colors[i]);}if(stage===2)s+=pill(720,458,320,'共有2个打结处',c.orange);}
  if(stage===3){s+=dim(X,X+model.joinedCM*S,68,'接好后180厘米')+joinedRope(128,false)+text(1240,139,'接好后','soft small','start');s+=`<g class="${animate?'rope-grow':''}">${restoredRope(336)}</g>`+text(720,239,'把两个结用去的长度放回去','soft')+dim(X,X+derived.originalTotalCM*S,416,'3根绳子原来的总长度',c.ink,'unit');}
  if(stage>=4){s+=dim(X,X+derived.originalTotalCM*S,87,'原来的总长度210厘米',c.ink,'large')+restoredRope(172,true);
    for(let i=0;i<=3;i++){let x=X+i*L;s+=line(x,151,x,228,c.ink,3);if(i>0&&i<3)s+=line(x,228,x,274,c.muted,2,'stroke-dasharray="6 6"');}
    for(let i=0;i<3;i++){let x=X+i*L;s+=dim(x,x+L,260,'一样长',colors[i],'small');const offset=i*68;s+=`<g class="${animate?'fade-in':''}" transform="translate(0 ${offset})">${ropeLine(540,540+L,335,colors[i],12)}${line(540,318,540,352,colors[i],2)}${line(540+L,318,540+L,352,colors[i],2)}</g>`;if(stage===5)s+=text(950,346+offset,'7分米','answer','start',colors[i]);}
    if(stage===4){s+=text(400,414,'一样长','soft','end');}else{s+=text(400,346,'每根','soft','end');}
  }
  return s;
}
const drawing={3:q3,5:q5,6:q6,7:q7};
function calculationFor(q,s){
  if(s===0)return {current:[],complete:null};
  let current=[],complete='';
  if(q===3){
    current=[[],['3厘米＝30毫米'],[`${model.clipEndMM}－${model.clipStartMM}＝${derived.clipMM}（毫米）`],[`${derived.clipMM}×${model.clipCount}＝${derived.pencilMM}（毫米）`],[`${derived.pencilMM}毫米＝${Math.floor(derived.pencilMM/10)}厘米${derived.pencilMM%10}毫米`]][s];
    complete=`（${model.clipEndMM}－${model.clipStartMM}）×${model.clipCount}＝${derived.pencilMM}（毫米）`;
  }else if(q===5){
    const hours=s,km=model.speedKMH*hours;
    current=[`${model.startHour+hours}－${model.startHour}＝${hours}（小时）`,`${model.speedKMH}×${hours}＝${km}（千米）`];
    complete=`${model.speedKMH}×（${model.endHour}－${model.startHour}）＝${derived.travelKM}（千米），${derived.travelKM}＞${model.distanceKM}`;
  }else if(q===6){
    const count=Math.min(s+2,derived.chairs);
    current=s===1?['3米6分米＝360厘米']:s===lessons[q].actions.length?[`${model.wallCM}÷${model.chairCM}＝${derived.chairs}（把）`]:[`${model.chairCM}×${count}＝${model.chairCM*count}（厘米）`];
    complete=`（300＋60）÷${model.chairCM}＝${derived.chairs}（把）`;
  }else if(q===7){
    const lost=model.knotCount*model.knotLossCM;
    current=[[],[`${model.ropeCount}－1＝${model.knotCount}（个）`],[`${model.knotLossCM}×${model.knotCount}＝${lost}（厘米）`],['1米8分米＝180厘米',`${model.joinedCM}＋${lost}＝${derived.originalTotalCM}（厘米）`],[`${derived.originalTotalCM}÷${model.ropeCount}＝${derived.originalRopeCM}（厘米）`],[`${derived.originalRopeCM}厘米＝${derived.originalRopeCM/10}分米`]][s];
    complete=`（${model.joinedCM}＋${model.knotLossCM}×${model.knotCount}）÷${model.ropeCount}＝${derived.originalRopeCM}（厘米）`;
  }
  return {current,complete:s===lessons[q].actions.length?complete:null};
}
function renderEquations(){
  const value=calculationFor(question,stage),panel=document.getElementById('equations');
  panel.hidden=value.current.length===0;
  document.getElementById('lesson').classList.toggle('has-equations',!panel.hidden);
  document.getElementById('step-equations').innerHTML=value.current.map(eq=>`<span class="equation-value">${eq}</span>`).join('');
  document.getElementById('final-equation-row').hidden=!value.complete;
  document.getElementById('final-equation').innerHTML=value.complete?`<span class="equation-value">${value.complete}</span>`:'';
}
function render(){const lesson=lessons[question];document.getElementById('question-number').textContent=`第${question}题`;document.getElementById('question-text').innerHTML=lesson.text;document.getElementById('lesson').setAttribute('aria-labelledby',`tab-${question}`);svg.setAttribute('aria-label',lesson.alt);svg.innerHTML=`<title>第${question}题课堂图示</title><desc>${lesson.alt}</desc>`+drawing[question]();svg.dataset.question=question;svg.dataset.stage=stage;renderEquations();prev.disabled=stage===0;next.disabled=stage===lesson.actions.length;next.innerHTML=(lesson.actions[stage]||'已到最后')+'<svg viewBox="0 0 24 24" aria-hidden="true" style="margin:0 0 0 14px"><path d="m9 5 7 7-7 7"/></svg>';for(const el of document.querySelectorAll('.tab')){const active=Number(el.dataset.q)===question;el.setAttribute('aria-selected',String(active));el.tabIndex=active?0:-1;}}
function move(amount){const target=Math.max(0,Math.min(lessons[question].actions.length,stage+amount));if(target===stage)return;animate=amount>0;stage=target;render();}
function reset(){stage=0;animate=false;render();}
function select(q){question=q;reset();}
next.addEventListener('click',()=>move(1));prev.addEventListener('click',()=>move(-1));document.getElementById('reset').addEventListener('click',reset);document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>select(Number(button.dataset.q))));
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}else{showFullscreenNote('请使用浏览器的全屏按钮。');}}catch(_){showFullscreenNote('此浏览器未允许页面全屏，可使用浏览器的全屏按钮。');}}
let noteTimer;function showFullscreenNote(message){const note=document.getElementById('fullscreen-note');note.textContent=message;note.classList.add('show');clearTimeout(noteTimer);noteTimer=setTimeout(()=>note.classList.remove('show'),6500);}
document.getElementById('fullscreen').addEventListener('click',fullscreen);document.addEventListener('fullscreenchange',()=>{document.querySelector('#fullscreen span').textContent=document.fullscreenElement?'退出全屏':'全屏';});
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey)return;const key=event.key.toLowerCase();if(event.target.closest('.tab')&&['arrowleft','arrowright'].includes(key)){event.preventDefault();const keys=[3,5,6,7],index=keys.indexOf(question),q=keys[(index+(key==='arrowright'?1:3))%4];select(q);document.getElementById(`tab-${q}`).focus();return;}if(key==='arrowright'||key==='pagedown'||(key===' '&&event.target===document.body)){event.preventDefault();move(1);}else if(key==='arrowleft'||key==='pageup'){event.preventDefault();move(-1);}else if(key==='r'||key==='home'){event.preventDefault();reset();}else if(key==='f'){event.preventDefault();fullscreen();}});
render();
</script>
